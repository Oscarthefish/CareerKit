name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - run: python -m unittest discover -s tests -v
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Smoke-test rendered routes
        run: |
          npm start &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          # curl's --retry does NOT retry on connection-refused by default
          # (only on transient HTTP/timeout errors) - without
          # --retry-connrefused it fails instantly, before "npm start" has
          # even opened the port, regardless of --retry count.
          for route in / /profile /cv /applications /scanner /linkedin /examples /settings /setup; do
            curl --fail --retry-connrefused --retry 10 --retry-delay 1 "http://127.0.0.1:3000$route" > /dev/null
          done
